[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Redirect www → non-www (fixes "Google chose different canonical" in GSC)
# Must come FIRST so it applies before any other redirect rules
[[redirects]]
  from = "https://www.zdentistry.in/*"
  to = "https://zdentistry.in/:splat"
  status = 301
  force = true

# Redirect old .netlify.app domain to custom domain (preserves SEO link equity)
[[redirects]]
  from = "https://zdentistry.netlify.app/*"
  to = "https://zdentistry.in/:splat"
  status = 301
  force = true

# Redirect /sitemap.xml → /sitemap-index.xml so GSC and crawlers find the sitemap
# regardless of which URL they try (Astro generates sitemap-index.xml, not sitemap.xml)
[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap-index.xml"
  status = 301
  force = true

# Force trailing slashes on all HTML pages (fixes duplicate content for /about vs /about/)
# Listed explicitly to avoid accidentally redirecting static assets (.xml, .txt, .png etc.)
[[redirects]]
