<!--
  This file helps Netlify detect forms during build.
  It will not be visible to users.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <title>Form Detection</title>
</head>
<body>
  <!-- Contact Form - for Netlify detection -->
  <form name="contact" netlify netlify-honeypot="bot-field" hidden>
    <input name="form-name" type="hidden" value="contact" />
    <input name="bot-field" />
    <input name="form-timestamp" />
    <input name="name" />
    <input name="phone" />
    <input name="email" />
    <input name="service" />
    <textarea name="message"></textarea>
  </form>
</body>
</html>
